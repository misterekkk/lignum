name: Benchmark Compare

# Manual back-to-back comparison of `base_ref` vs HEAD on the same physical runner VM
# (x86-64 and ARM64) to eliminate cross-runner noise when evaluating optimizations.
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base git ref to compare against"
        required: false
        default: "main"
        type: string
      args:
        description: "Arguments for benchmarks/bench.py"
        required: false
        default: "--rows 300000 --trees 500 --repeats 5"
        type: string

permissions:
  contents: read

jobs:
  compare:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout HEAD
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout base ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref }}
          path: base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CPU info
        run: lscpu | grep -E "Model name|^CPU\(s\)|Thread|Flags" | cut -c1-200 || true

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./head[test]"

      - name: Prepare shared workload cache
        run: |
          mkdir -p shared-cache results-out
          rm -rf base/benchmarks/.cache head/benchmarks/.cache
          ln -s "$PWD/shared-cache" base/benchmarks/.cache
          ln -s "$PWD/shared-cache" head/benchmarks/.cache

      - name: Benchmark base (${{ inputs.base_ref }})
        env:
          BENCH_ARGS: ${{ inputs.args }}
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --force-reinstall --no-deps ./base
          python base/benchmarks/bench.py --engines lignum $BENCH_ARGS | tee results-out/base.log
          cp "$(ls -t base/benchmarks/results/*.json | head -1)" results-out/base.json
          cp "$(ls -t base/benchmarks/results/*.md | head -1)" results-out/base.md

      - name: Benchmark HEAD (${{ github.ref_name }})
        env:
          BENCH_ARGS: ${{ inputs.args }}
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --force-reinstall --no-deps ./head
          python head/benchmarks/bench.py --engines lignum $BENCH_ARGS | tee results-out/head.log
          cp "$(ls -t head/benchmarks/results/*.json | head -1)" results-out/head.json
          cp "$(ls -t head/benchmarks/results/*.md | head -1)" results-out/head.md

      - name: Compare base vs HEAD
        env:
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ github.ref_name }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          python - <<'PY' | tee results-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          base = json.loads(Path("results-out/base.json").read_text())
          head = json.loads(Path("results-out/head.json").read_text())

          b_map = {r["model"]: r for r in base["results"] if r["engine"] == "lignum"}
          h_map = {r["model"]: r for r in head["results"] if r["engine"] == "lignum"}

          metrics = [
              ("prep [s]", "prep_s", ".3f"),
              ("batch best [s]", "batch_best_s", ".3f"),
              ("batch median [s]", "batch_median_s", ".3f"),
              ("1 thread [s]", "batch1_best_s", ".3f"),
              ("1 row [us]", "lat1_us", ".1f"),
              ("1 row 1t [us]", "lat1_st_us", ".1f"),
              ("100 rows [us]", "lat100_us", ".1f"),
              ("100 rows 1t [us]", "lat100_st_us", ".1f"),
          ]

          lines = [
              f"### `{os.environ['MATRIX_OS']}`: `{os.environ['BASE_REF']}` ({base['env']['commit']}) vs `{os.environ['HEAD_REF']}` ({head['env']['commit']})",
              f"- CPU: {head['env']['cpu']}, threads: {head['env']['threads']}",
              "",
              "| model | metric | base | head | speedup (base/head) |",
              "|---|---|---:|---:|---:|",
          ]
          for model, br in b_map.items():
              hr = h_map.get(model)
              if not hr or br.get("error") or hr.get("error"):
                  err = (br or {}).get("error") or (hr or {}).get("error") or "missing"
                  lines.append(f"| {model} | status | {err} | — | — |")
                  continue
              for label, key, fmt in metrics:
                  bv, hv = br.get(key), hr.get(key)
                  if bv is None or hv is None or hv == 0:
                      continue
                  lines.append(f"| {model} | {label} | {bv:{fmt}} | {hv:{fmt}} | {bv / hv:.2f}x |")
              mm = f"{br.get('mismatch_bench', '?')}/{br.get('mismatch_train', '?')} -> {hr.get('mismatch_bench', '?')}/{hr.get('mismatch_train', '?')}"
              lines.append(f"| {model} | mismatch (bench/train) | — | — | `{mm}` |")

          print("\n".join(lines) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: bench-compare-${{ matrix.os }}
          path: results-out/
