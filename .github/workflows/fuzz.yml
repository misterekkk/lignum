name: Fuzzing

# Coverage-guided fuzzing (libFuzzer) of every model format under AddressSanitizer and
# UndefinedBehaviorSanitizer: tests/fuzz/fuzz_load.cpp, one target per library. A minute per target
# on each push, longer every night; the corpus is cached between runs, so each run starts where the
# last one stopped. A crash fails the job and uploads the input (reproduce: tests/fuzz/README.md).
on:
  push:
    branches: [main, 'dev/**']
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/fuzz/**'
      - 'CMakeLists.txt'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: "41 3 * * *"  # daily, 03:41 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        required: false
        default: "600"

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lignum, lightgbm, xgboost, catboost]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Clang with libFuzzer
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q clang libclang-rt-dev
          echo 'extern "C" int LLVMFuzzerTestOneInput(const unsigned char*, unsigned long) { return 0; }' > probe.cpp
          clang++ -fsanitize=fuzzer,address probe.cpp -o probe && echo "::notice title=Fuzzer toolchain::$(clang++ --version | head -1)"

      - name: Build the fuzzers (ASan + UBSan)
        id: build
        shell: bash
        run: |
          set -o pipefail
          { cmake -S . -B build-fuzz -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                  -DLIGNUM_SANITIZE=ON "-DLIGNUM_SANITIZERS=address,undefined,fuzzer-no-link" -DLIGNUM_BUILD_FUZZERS=ON \
                  -DLIGNUM_BUILD_C_LIBRARY=OFF &&
            cmake --build build-fuzz --parallel --target fuzz_${{ matrix.target }}; } 2>&1 | tee build.log

      - name: Build failure as an annotation
        if: failure() && steps.build.outcome == 'failure'
        run: python .github/scripts/annotate_log.py "Building the fuzzers" build.log

      - name: Seed corpus (small models of every format)
        run: |
          python -m pip install ".[test]"
          python tests/fuzz/make_corpus.py seeds

      - name: Restore the corpus of earlier runs
        uses: actions/cache@v4
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        shell: bash
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || (github.event_name == 'schedule' && '900') || '60' }}
        run: |
          set -o pipefail
          mkdir -p corpus/${{ matrix.target }} crashes
          for f in seeds/${{ matrix.target }}/*; do  # seeds the cached corpus lacks
            [ -e "corpus/${{ matrix.target }}/$(basename "$f")" ] || cp "$f" corpus/${{ matrix.target }}/
          done
          ./build-fuzz/tests/fuzz/fuzz_${{ matrix.target }} corpus/${{ matrix.target }} -max_total_time=$SECONDS_PER_TARGET \
              -timeout=10 -rss_limit_mb=2048 -print_final_stats=1 -artifact_prefix=crashes/ 2>&1 | tail -n 200 | tee fuzz.log

      - name: Failure as an annotation
        if: failure() && steps.build.outcome == 'success'
        run: python .github/scripts/annotate_log.py "Fuzzing ${{ matrix.target }}" fuzz.log

      # The start of the report (the kind of error and where), which the annotation above cuts off
      # for long stacks: the first crashing input run once more.
      - name: Crash report as an annotation
        if: failure() && steps.build.outcome == 'success'
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          crash=$(ls crashes/* 2>/dev/null | head -1)
          [ -n "$crash" ] || exit 0
          ./build-fuzz/tests/fuzz/fuzz_${{ matrix.target }} -timeout=10 -rss_limit_mb=2048 "$crash" > report.txt 2>&1 || true
          python - "$crash" <<'PY'
          import re, sys
          text = open("report.txt", errors="replace").read()
          m = re.search(r"ERROR:|runtime error|deadly signal|lignum fuzz:", text)
          start = text.rfind("\n", 0, m.start()) + 1 if m else 0
          body = f"input {sys.argv[1]}\n" + text[start:start + 3500]
          print("::error title=Fuzzing crash report::" + body.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: crashes/
