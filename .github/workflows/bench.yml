name: Benchmark

# Manual run on shared GitHub runners. Absolute times are noisy; compare engines within one run
# (ratios), not across runs. Results are uploaded as an artifact.
on:
  # Runs when the benchmark itself changes on the development branch; otherwise start it by hand.
  push:
    branches: [dev/v0.2]
    paths:
      - '.github/workflows/bench.yml'
      - 'benchmarks/bench.py'
  workflow_dispatch:
    inputs:
      args:
        description: "Arguments for benchmarks/bench.py"
        required: false
        default: "--rows 300000 --trees 500 --repeats 5"

jobs:
  bench:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lignum and engines
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
          python -m pip install treelite tl2cgen lleaves "llvmlite<0.45" onnxruntime onnxmltools onnxconverter-common

      - name: CPU info
        run: lscpu | grep -E "Model name|^CPU\(s\)|Thread|Flags" | cut -c1-200

      - name: Run benchmark
        run: python benchmarks/bench.py ${{ github.event.inputs.args || '--rows 300000 --trees 500 --repeats 5' }}

      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: benchmarks/results/
