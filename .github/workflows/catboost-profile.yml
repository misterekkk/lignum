name: CatBoost profile

# Work per row of lignum and CatBoost (C API) on CatBoost models, counted by cachegrind on x86-64
# and aarch64: instructions, memory reads and writes, simulated cache misses and branch
# mispredictions, lignum's hot source lines, and stack accesses in its kernel (objdump).
# Every variant of the CatBoost kernel (LIGNUM_CATBOOST_FLOATS, LIGNUM_CATBOOST_U8) is built and
# measured in the same job, with CatBoost as the reference. Runs when this file or the profiling
# script change, or by hand.
on:
  push:
    branches: [main, 'dev/**']
    paths:
      - 'benchmarks/catboost_profile.py'
      - 'src/catboost.cpp'
      - '.github/workflows/catboost-profile.yml'
  workflow_dispatch:

jobs:
  profile:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lignum, CatBoost, valgrind and perf
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q valgrind
          sudo apt-get install -y -q linux-tools-common "linux-tools-$(uname -r)" || echo "no perf for this kernel"
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
          python -m pip install --upgrade pip
          python -m pip install ".[test]" polars

      - name: Cache datasets
        uses: actions/cache@v4
        with:
          path: benchmarks/.cache/datasets
          key: datasets-v1

      - name: Profile every kernel variant (float buckets search / count / two levels, u16 / u8)
        run: |
          set -o pipefail
          python benchmarks/catboost_profile.py --datasets california,adult,covtype --rows 20000 | tee profile.md

      - uses: actions/upload-artifact@v4
        with:
          name: catboost-profile-${{ matrix.os }}
          path: profile.md
