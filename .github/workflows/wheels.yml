name: Wheels

# Builds the wheels and the sdist on every change to the build, and publishes them on request:
# run the workflow by hand with target=testpypi or pypi (trusted publishing; the pypi environment
# needs the owner's approval).
on:
  push:
    branches: [dev/v0.2, main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'python/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - '.github/workflows/wheels.yml'
  workflow_dispatch:
    inputs:
      target:
        description: "Publish to: none, testpypi or pypi"
        required: false
        default: "none"

# A push cancels the previous push build of its branch, never a manual (publishing) run.
concurrency:
  group: wheels-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest           # manylinux x86_64
          - os: ubuntu-24.04-arm        # manylinux aarch64
          # Homebrew's libomp is built for the runner's macOS, so wheels need macOS >= 15
          # (MACOSX_DEPLOYMENT_TARGET in pyproject.toml).
          - os: macos-15                # arm64
          - os: macos-15-intel          # x86_64
          - os: windows-latest          # x64
    steps:
      - uses: actions/checkout@v4

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.2.1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - name: Install from the sdist and smoke test
        run: |
          python -m pip install dist/*.tar.gz
          python tests/python/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target != 'none'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target }}
    permissions:
      id-token: write  # trusted publishing: no API token stored in the repository
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: github.event.inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
