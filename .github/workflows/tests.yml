name: Tests

on:
  push:
    paths:
      - 'include/**'
      - 'src/**'
      - 'python/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  pull_request:

# Read-only token: the jobs only check out the code and pass artifacts between themselves.
permissions:
  contents: read

jobs:
  cpp:
    name: C++ tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      # The compiler's default target, as an annotation (readable without the logs). GitHub's
      # Ubuntu 26.04 image sets GCC's default to x86-64-v3 (AVX2); the builds below ask for the
      # x86-64 baseline the wheels use, so that check_kernel_isa.py finds AVX only where lignum
      # chooses it at run time.
      - name: Compiler defaults
        if: runner.os == 'Linux'
        run: |
          echo "::notice title=Compiler defaults::$(c++ --version | head -1); $(c++ -Q --help=target | grep -E '^\s+-march=' | tr -s ' \t' ' ')"

      - name: Configure
        env:
          CXXFLAGS: ${{ runner.os == 'Linux' && '-march=x86-64 -mtune=generic' || '' }}
        run: cmake -S . -B build -DLIGNUM_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build -C Release --output-on-failure 2>&1 | tee ctest.log

      - name: Failures as an annotation
        if: failure()
        run: python .github/scripts/annotate_log.py "C++ tests on ${{ matrix.os }}" ctest.log

  sanitizers:
    name: C++ tests with ASan + UBSan (incl. fuzzing of model files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CXXFLAGS: -march=x86-64 -mtune=generic  # the wheels' baseline (see the job above)
        run: cmake -S . -B build -DLIGNUM_BUILD_TESTS=ON -DLIGNUM_SANITIZE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install package
        run: python -m pip install ".[test]"

      - name: Run tests
        run: python -m pytest tests/python -v

      # x86-64 Linux and Windows runners have AVX2, so the run above used the AVX2 build of the
      # CatBoost kernel; this one forces the generic build (what CPUs without AVX2 get).
      - name: Run CatBoost tests with the generic kernel (x86-64 Linux and Windows)
        if: runner.os != 'macOS' && runner.arch == 'X64'
        env:
          LIGNUM_ISA: generic
        run: python -m pytest tests/python/test_catboost.py tests/python/test_real_data.py -v -k "catboost"
